--path:"src"
--hints:off
# The enrichment sources are HTTPS only, so TLS is not optional for the CLI.
--define:ssl
# The window is built on libadwaita toolbars, so it only builds with the target
# Adwaita minor version declared. 1.4 is the oldest release with AdwToolbarView,
# and it already requires GTK 4.10, which is why the GTK minor target matches.
--define:adwminor=4
--define:gtkminor=10

# Relay (the HTTP client) shares ref objects across its worker thread, so it
# needs threads and atomic reference counting. Its own config.nims sets both,
# but that file does not reach consumers, so they are repeated here.
--threads:on
--mm:atomicArc
# Relay binds libcurl directly and does not link it for its consumers.
--passL:"-lcurl"
# curl 8.16+ ships a typecheck-gcc.h whose curl_multi_setopt macro rewrites the
# function's own declaration in multi.h, which fails to compile on Fedora's
# curl 8.18. Relay's own config.nims disables the typechecker for this reason.
--passC:"-DCURL_DISABLE_TYPECHECK"

############# begin Atlas config section ##########
--noNimblePath
--path:"deps/brian/src"
--path:"deps/owlkettle"
--path:"deps/relay/src"
############# end Atlas config section   ##########
